{% extends "common/base.html" %}

{% block content %}
    {% if card %}
        <h2> Update a card ✏️</h2>
    {% else %}
        <h2> Create a new card ✨</h2>
    {% endif %}
    <form method="post">
        {% csrf_token %}    <!--for security-->
        {{ form.as_p }}     <!--wrap fields as paragraphs-->
        <input type="submit" value="✅ Save">
        <a href="{% url 'card-list' %}" class="button">❌ Cancel</a>
    </form>

{% endblock content %}
